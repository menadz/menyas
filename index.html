<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y&M : The love story</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<header class="header">
  <span class="eyebrow">Y&M : The love story</span>
  <div class="header-right">
    <h1 class="brand">iLoveYou.com</h1>
    <button class="music-toggle" id="musicToggle" aria-label="Activer la musique de fond">
      <span class="music-icon">♪</span><span class="music-label">Musique</span>
    </button>
  </div>
</header>

<audio id="bgMusic" loop preload="none"></audio>

<main class="logbook" id="logbook">

  <section class="entry-head">
    <div class="entry-index" id="entryIndex">ENTRÉE N° 01</div>
    <h2 class="entry-date" id="entryDate">—</h2>
    <p class="entry-title" id="entryTitle">Chargement…</p>
    <p class="entry-desc" id="entryDesc"></p>
  </section>

  <section class="entry-body">
    <div class="panel carousel-panel">
      <div class="panel-label">Photographies</div>
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="car-btn car-prev" id="carPrev" aria-label="Image précédente">‹</button>
        <button class="car-btn car-next" id="carNext" aria-label="Image suivante">›</button>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
    </div>

    <div class="panel map-panel">
      <div class="panel-label">Localisation</div>
      <div class="map-wrap">
        <div id="map"></div>
      </div>
      <div class="map-caption" id="mapCaption">—</div>
    </div>
  </section>

</main>

<footer class="timeline-dock">
  <div class="timeline-scale">
    <div class="timeline-line"></div>
    <div class="timeline-progress" id="timelineProgress"></div>
    <div class="timeline-ticks" id="timelineTicks"></div>
    <div class="timeline-handle" id="timelineHandle">
      <div class="handle-pin"></div>
    </div>
  </div>
  <div class="timeline-nav">
    <button class="nav-btn" id="prevBtn" aria-label="Date précédente">← Précédent</button>
    <span class="nav-count" id="navCount"></span>
    <button class="nav-btn" id="nextBtn" aria-label="Date suivante">Suivant →</button>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
